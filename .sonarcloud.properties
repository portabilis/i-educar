# Configuração da análise automática do SonarCloud.
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis/

# Os testes ficam fora da análise: sem esta linha eles são analisados como
# código de produção, e as regras de literais repetidos, nomes, herança e
# duplicação apontam centenas de casos que não se aplicam a testes.
sonar.exclusions=tests/**
