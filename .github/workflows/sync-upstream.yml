name: Sync Upstream to Downstream

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão base (ex: 2.10)'
        required: true

jobs:
  sync:
    name: Sync ${{ inputs.version }} branches
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório privado
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Adicionar remoto upstream
        run: |
          git remote add upstream https://github.com/portabilis/i-educar.git
          git fetch upstream

      - name: Atualizar a branch <versão>-upstream com upstream/<versão>
        run: |
          UPSTREAM_BRANCH="${{ inputs.version }}-upstream"
          UPSTREAM_REF="upstream/${{ inputs.version }}"

          # Cria a branch se não existir
          if ! git show-ref --verify --quiet refs/heads/$UPSTREAM_BRANCH; then
            git checkout -b $UPSTREAM_BRANCH $UPSTREAM_REF
          else
            git checkout $UPSTREAM_BRANCH
            git merge --no-edit $UPSTREAM_REF || true
          fi

      - name: Atualizar a branch <versão>-downstream com as mudanças da upstream
        run: |
          DOWNSTREAM_BRANCH="${{ inputs.version }}-downstream"

          # Cria a branch se não existir
          if ! git show-ref --verify --quiet refs/heads/$DOWNSTREAM_BRANCH; then
            git checkout -b $DOWNSTREAM_BRANCH $UPSTREAM_BRANCH
          else
            git checkout $DOWNSTREAM_BRANCH
            git merge --no-edit $UPSTREAM_BRANCH || true
          fi

      - name: Push das branches atualizadas
        run: |
          git push origin "${{ inputs.version }}-upstream"
          git push origin "${{ inputs.version }}-downstream"
