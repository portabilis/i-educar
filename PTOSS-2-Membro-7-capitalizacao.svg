<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="390" viewBox="0 0 1180 390">
  <rect width="1180" height="390" rx="12" fill="#0d1117"/>
  <path d="M12 0h1156a12 12 0 0 1 12 12v38H0V12A12 12 0 0 1 12 0" fill="#161b22"/>
  <circle cx="24" cy="25" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="25" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="25" r="6" fill="#27c93f"/>
  <text x="88" y="31" fill="#c9d1d9" font-family="Segoe UI, sans-serif" font-size="15">NameCapitalizationService.php — execute()</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="17">
    <g fill="#6e7681" text-anchor="end">
      <text x="48" y="87">1</text><text x="48" y="119">2</text><text x="48" y="151">3</text>
      <text x="48" y="183">4</text><text x="48" y="215">5</text><text x="48" y="247">6</text>
      <text x="48" y="279">7</text><text x="48" y="311">8</text><text x="48" y="343">9</text>
      <text x="48" y="375">10</text>
    </g>
    <g fill="#e6edf3">
      <text x="72" y="87">public function execute(string $name): string</text>
      <text x="72" y="119">{</text>
      <text x="72" y="151">$titleCase = Str::title($name);</text>
      <text x="72" y="183"></text>
      <text x="72" y="215">return preg_replace_callback(</text>
      <text x="72" y="247">'/(?&lt;![\p{L}\p{M}])(de|da|do|dos|das|e)(?![\p{L}\p{M}])/iu',</text>
      <text x="72" y="279">fn (array $matches) =&gt; Str::lower($matches[0]),</text>
      <text x="72" y="311">$titleCase</text>
      <text x="72" y="343">) ?? throw new \InvalidArgumentException('O nome deve conter texto UTF-8 válido.');</text>
      <text x="72" y="375">}</text>
    </g>
  </g>
</svg>
